# Auto PR precisa de uma destas opções:
# 1) Repo → Settings → Actions → General → Workflow permissions:
#    marcar "Read and write permissions" E "Allow GitHub Actions to create and approve pull requests"
# 2) Ou criar secret GH_PR_CREATE_TOKEN (fine-grained PAT: Contents read, Pull requests write no repo)
name: Feature Workflow

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - 'feat/**'

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Security audit (Block moderate and above)
        # Expo/ESLint transitives often report high until upstream bumps; gate on critical only.
        run: pnpm audit --audit-level critical
        continue-on-error: false

      - name: Quality check passed
        run: echo "All quality checks passed!"

  create-pr:
    name: Auto Create PR
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR already exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GH_PR_CREATE_TOKEN != '' && secrets.GH_PR_CREATE_TOKEN || github.token }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base staging --json number --jq length)
          echo "pr_exists=$PR_EXISTS" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-pr.outputs.pr_exists == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_CREATE_TOKEN != '' && secrets.GH_PR_CREATE_TOKEN || github.token }}
        run: |
          BRANCH_NAME="${{ steps.check-pr.outputs.branch_name }}"
          FEATURE_NAME=$(echo "$BRANCH_NAME" | sed 's/feat\///' | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')

          gh pr create \
            --base staging \
            --head "$BRANCH_NAME" \
            --title "Feature: $FEATURE_NAME" \
            --body "Auto-generated PR from feature branch"

      - name: PR Info
        if: steps.check-pr.outputs.pr_exists != '0'
        run: echo "PR already exists for this branch"

