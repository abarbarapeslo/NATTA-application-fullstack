name: Staging Workflow

on:
  push:
    branches:
      - staging
      - feat/**
  pull_request:
    branches:
      - staging

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Lint
        run: pnpm run lint

      - name: Security audit
        # Expo/ESLint transitives often report high until upstream bumps; gate on critical only.
        run: pnpm audit --audit-level critical
        continue-on-error: false

      - name: Quality check passed
        run: echo "All quality checks passed!"
  # PR automático só no Feature Workflow (evita corrida duplicada em push feat/**)

  deploy-staging:
    name: Deploy to Staging (Vercel)
    needs: quality-check
    runs-on: ubuntu-latest
    # Vercel desativado por enquanto. Para reativar, troque por:
    # if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    if: false
    permissions:
      contents: read
    environment:
      name: staging
      url: https://your-staging-url.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Enable Corepack
        run: corepack enable

      - name: Deploy to Vercel (Staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying to Vercel Staging..."

          pnpm dlx vercel@latest deploy \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --yes

      - name: Deployment completed
        run: |
          echo "Deployment to staging completed"
          echo "Check your deployment at Vercel dashboard"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Staging deployment failed"
          echo "Notification will be sent to ${{ github.actor }}"
