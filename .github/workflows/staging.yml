name: Staging Workflow

on:
  push:
    branches:
      - staging
      - feat/**
  pull_request:
    branches:
      - staging

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Lint
        run: pnpm run lint

      - name: Security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: false

      - name: Quality check passed
        run: echo "All quality checks passed!"

  create-pr:
    name: Auto Create PR
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR already exists
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base staging --json number --jq length)
          echo "pr_exists=$PR_EXISTS" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-pr.outputs.pr_exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="${{ steps.check-pr.outputs.branch_name }}"
          FEATURE_NAME=$(echo "$BRANCH_NAME" | sed 's/feat\///' | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')

          gh pr create \
            --base staging \
            --head "$BRANCH_NAME" \
            --title "Feature: $FEATURE_NAME" \
            --body "Auto-generated PR from feature branch"

      - name: PR Info
        if: steps.check-pr.outputs.pr_exists != '0'
        run: echo "PR already exists for this branch"

  deploy-staging:
    name: Deploy to Staging (Vercel)
    needs: quality-check
    runs-on: ubuntu-latest
    # Vercel desativado por enquanto. Para reativar, troque por:
    # if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    if: false
    permissions:
      contents: read
    environment:
      name: staging
      url: https://your-staging-url.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Deploy to Vercel (Staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying to Vercel Staging..."

          pnpm dlx vercel@latest deploy \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --yes

      - name: Deployment completed
        run: |
          echo "Deployment to staging completed"
          echo "Check your deployment at Vercel dashboard"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Staging deployment failed"
          echo "Notification will be sent to ${{ github.actor }}"
