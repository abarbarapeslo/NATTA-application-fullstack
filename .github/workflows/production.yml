name: Production Workflow

on:
  push:
    branches:
      - main

jobs:
  quality-check:
    name: Quality Check (Strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Strict)
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Lint (Strict)
        run: pnpm run lint

      - name: Run tests (Strict)
        run: pnpm test

      - name: Security audit (STRICT - No vulnerabilities allowed)
        run: |
          echo "Running strict security audit..."
          pnpm audit --audit-level moderate
          if [ $? -ne 0 ]; then
            echo "Security vulnerabilities found! Deployment BLOCKED."
            exit 1
          fi
          echo "No moderate/high vulnerabilities found!"

      - name: Quality check passed
        run: echo "All quality checks passed! Ready for production."

  deploy-production:
    name: Deploy to Production (Vercel)
    needs: quality-check
    runs-on: ubuntu-latest
    # Vercel desativado por enquanto. Para reativar, remova a linha abaixo.
    if: false
    permissions:
      contents: read
      issues: write
    environment:
      name: production
      url: https://your-production-url.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Enable Corepack
        run: corepack enable

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying to Vercel Production..."

          pnpm dlx vercel@latest deploy \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --prod \
            --yes

      - name: Deployment completed
        run: |
          echo "Deployment to production completed!"
          echo "Check your deployment at Vercel dashboard"
          echo "Deployed by: ${{ github.actor }}"

      - name: Notify owner on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Production deployment FAILED!"
          gh issue create \
            --title "Production Deployment Failed - $(date '+%Y-%m-%d %H:%M')" \
            --body "**Deployment to production failed!**\n\n- **Triggered by:** @${{ github.actor }}\n- **Branch:** ${{ github.ref_name }}\n- **Commit:** ${{ github.sha }}\n- **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease check the logs and fix the issues." \
            --label "bug,production,urgent" \
            --assignee "${{ github.repository_owner }}"
