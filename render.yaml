# Render Blueprint for the NATTA AI server (Express + tRPC, Claude-powered).
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. On Render: New → Blueprint → select this repo (it reads render.yaml).
#   3. Set the secret env var ANTHROPIC_API_KEY in the Render dashboard.
#   4. After the first deploy, copy the service URL and set it in the app's .env:
#        EXPO_PUBLIC_AI_API_URL=https://<your-service>.onrender.com
#
# Health check hits /api/health. The AI endpoint is /api/trpc/ai.improveResume.
services:
  - type: web
    name: natta-ai-server
    runtime: node
    plan: free
    region: oregon
    # `corepack pnpm` runs the version pinned in package.json (packageManager)
    # without `corepack enable`, which fails on Render's read-only /usr/bin (EROFS).
    # --prod=false ensures build-time devDeps (esbuild) are installed even though
    # NODE_ENV=production is set.
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    startCommand: node dist/index.mjs
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Set this in the Render dashboard — never commit it.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      # Must match the project in google-services.json so ID tokens verify.
      - key: FIREBASE_PROJECT_ID
        value: natta-app-b9e3b
